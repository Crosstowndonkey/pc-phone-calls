# "Phone clean mic": a virtual microphone that takes your normal microphone,
# removes background noise (fans, keyboard, traffic) and low rumble, and offers
# the result as an extra microphone. Phone sends this to the person you are
# talking to when "Clean up my voice" is ticked. Other programs can pick it too.
#
# Needs the RNNoise plugin:  sudo pacman -S noise-suppression-for-voice
# Runs in PipeWire's filter-chain service:  systemctl --user enable --now filter-chain
# After changing a number here:              systemctl --user restart filter-chain
context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Phone clean mic"
            media.name       = "Phone clean mic"
            filter.graph = {
                nodes = [
                    {
                        # Cuts rumble below the voice (desk bumps, hum).
                        type    = builtin
                        name    = rumble
                        label   = bq_highpass
                        control = { "Freq" = 80.0 "Q" = 0.7 }
                    }
                    {
                        # Noise removal. "VAD Threshold" is how sure it must be that
                        # you are speaking before it lets sound through. 0 = never
                        # mutes, only cleans: the most natural, and the default here.
                        # Higher (say 30 to 50) = dead-silent gaps between sentences,
                        # but soft word starts and endings can get clipped.
                        # "Grace Period" keeps it open after you stop speaking.
                        type    = ladspa
                        name    = rnnoise
                        plugin  = "librnnoise_ladspa"
                        label   = noise_suppressor_mono
                        control = {
                            "VAD Threshold (%)"     = 0.0
                            "VAD Grace Period (ms)" = 300
                            # Only matters with a VAD Threshold above 0; adds delay.
                            "Retroactive VAD Grace (ms)" = 0
                            # How much of the untouched microphone is mixed back in
                            # (0 = none, 1 = all). A little keeps the voice natural
                            # and the line from sounding dead; more lets noise back.
                            "Dry Mix"               = 0.15
                        }
                    }
                ]
                links = [
                    { output = "rumble:Out" input = "rnnoise:Input" }
                ]
                inputs  = [ "rumble:In" ]
                outputs = [ "rnnoise:Output" ]
            }
            capture.props = {
                node.name    = "phone_clean_mic_input"
                node.passive = true          # doesn't keep the microphone busy when unused
                audio.rate   = 48000         # the noise remover only works at this rate
            }
            playback.props = {
                node.name    = "phone_clean_mic"
                media.class  = Audio/Source
                audio.rate   = 48000
            }
        }
    }
]
