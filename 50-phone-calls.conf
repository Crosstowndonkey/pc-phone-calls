# Lets the PC act as a Bluetooth hands-free unit (like a car kit) for a phone,
# so phone calls can use the PC's headset and microphone.
# The other roles are the normal defaults (Bluetooth headphones, speakers etc.).
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source bap_sink bap_source hfp_hf hfp_ag ]
  bluez5.hfphsp-backend = "native"
}
